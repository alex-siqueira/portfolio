---
layout: default
---
<div class="post-header">
    <div class="post-header__inner">
        <a href="{{ '/blog/' | relative_url }}" class="post-header__back">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Todas as publicações
        </a>
        <div class="post-header__meta">
            <span class="pub-tag {{ page.tag_class }}">{{ page.tag_label }}</span>
            <time class="post-header__date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date_display }}</time>
        </div>
        <h1>{{ page.title }}</h1>
        <p class="post-header__excerpt">{{ page.excerpt_text }}</p>
    </div>
</div>

<div class="post-body">
    <div class="post-content">
        {{ content }}
        <div class="post-footer">
            <div class="post-footer__author">
                <p class="post-footer__author-name">Alexandre Siqueira</p>
                <p class="post-footer__author-role">Especialista em Cibersegurança &middot; Mercado Livre</p>
            </div>
            <a href="{{ '/blog/' | relative_url }}" class="btn btn--ghost">Ver todas as publicações</a>
        </div>
    </div>
</div>
