---
layout: default
---
<div class="post-header">
    <div class="container">
        <a href="/blog/" class="post-header__back">
            <i class="bx bx-arrow-back" aria-hidden="true"></i> Todas as publicações
        </a>
        <div class="post-header__meta">
            <span class="pub-tag {{ page.tag_class }}">{{ page.tag_label }}</span>
            <time class="post-header__date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date_display }}</time>
        </div>
        <h1>{{ page.title }}</h1>
        <p class="post-header__excerpt">{{ page.excerpt_text }}</p>
    </div>
</div>

<article class="post-body section section--light">
    <div class="container">
        <div class="post-content">
            {{ content }}
            <div class="post-footer">
                <div class="post-footer__author">
                    <div>
                        <p class="post-footer__author-name">Alexandre Siqueira</p>
                        <p class="post-footer__author-role">Especialista em Cibersegurança &middot; Mercado Livre</p>
                    </div>
                </div>
                <a href="/blog/" class="btn btn--ghost" style="border-color: var(--light-border); color: var(--text-light);">Ver todas as publicações</a>
            </div>
        </div>
    </div>
</article>
